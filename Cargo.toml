[package]
name = "sfn-ng"
version = "0.2.30"
authors = ["Patrick Robinson <patrick.robinson@bertelsmann.de>", "Stephan Telahr <stephan.telahr@bertelsmann.de>"]
edition = "2024"
license = "GPL-3.0"
description = "Rust replacement for sfn with more features"
homepage = "https://github.com/arvatoaws-labs/sfn-ng"
documentation = "https://github.com/arvatoaws-labs/sfn-ng"
repository = "https://github.com/arvatoaws-labs/sfn-ng"
readme = "README.md"
# keywords
# categories
exclude = [
  "Dockerfile",
  ".github/*",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aws-config = "1.12.0"
aws-sdk-cloudformation = "1.130.0"
aws-sdk-ec2 = "1.267.0"
aws-sdk-s3 = "1.152.0"
aws-sdk-sts = "1.119.0"
aws-types = "1.6.0"
aws-smithy-types = "1.8.1"
tokio = { version = "1.53.2", features = ["full"] }
clap = { version = "4.5.51", features = ["derive"] }
colored = "3.1.1"
itertools = "0.15.0"
serde_json = "1.0.151"
chrono = "0.4.45"
async-recursion = "1.2.0"
whoami = "2.1.3"
string_morph = "0.1.0"
walkdir = "2.5.0"
json-structural-diff = "0.2.0"
